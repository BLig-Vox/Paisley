<!doctype html>
<meta charset="utf-8">
<title>Embedded content fixture</title>
<h1>Embedded content</h1>
<script>
    window.framesReady = new Set();
    addEventListener('message', event => {
        if (['srcdoc', 'blob', 'data'].includes(event.data)) {
            window.framesReady.add(event.data);
        }
    });
    function page(name) {
        return '<!doctype html><title>' + name + '</title><p>' + name +
            ' frame ready</p><script>parent.postMessage("' + name + '", "*")<' + '/script>';
    }
    for (const kind of ['srcdoc', 'blob', 'data', 'blank']) {
        const frame = document.createElement('iframe');
        frame.id = kind;
        if (kind === 'srcdoc') frame.srcdoc = page(kind);
        if (kind === 'blob') frame.src = URL.createObjectURL(new Blob([page(kind)], {type: 'text/html'}));
        if (kind === 'data') frame.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(page(kind));
        if (kind === 'blank') {
            frame.src = 'about:blank#embedded';
            frame.onload = () => {
                if (frame.contentDocument.URL === 'about:blank#embedded') window.framesReady.add('blank');
            };
        }
        document.body.appendChild(frame);
    }
</script>
