[package]
name = "browny"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Linux-first multi-tab browser built with Rust, GTK4, and WebKitGTK."
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit = { package = "webkit6", version = "0.6" }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fonts-rs-lucide = "0.5"
