[package]
name = "vox-paisley"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Linux-first multi-tab browser built with Rust, GTK4, and WebKitGTK."
license = "MIT"
authors = ["Alexander Vox <alexander.vox.great@gmail.com>"]
repository = "https://github.com/BLig-Vox/Browny"
readme = "README.md"
keywords = ["browser", "webkit", "gtk4", "linux", "privacy"]
categories = ["web-programming", "gui"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt", "src/**", "assets/**", "docs/**", "packaging/**", "scripts/**", "tests/**"]

[lib]
name = "paisley"

[[bin]]
name = "paisley"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit = { package = "webkit6", version = "0.6" }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fonts-rs-lucide = "0.5"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
sha2 = "0.10"
libc = "0.2"
bytes = "1"
